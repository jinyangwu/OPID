<svg width="1680" height="980" viewBox="0 0 1680 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1680" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="headerBand" x1="0" y1="0" x2="1680" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DBEAFE"/>
      <stop offset="0.5" stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L11 7L1 13" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 38px 'Avenir Next', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .section { font: 700 16px 'Avenir Next', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; fill: #0F172A; letter-spacing: 0.06em; }
      .boxTitle { font: 700 22px 'Avenir Next', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .boxText { font: 500 18px 'Avenir Next', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .pill { font: 700 14px 'Avenir Next', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; fill: #0F172A; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1680" height="980" fill="url(#bg)"/>
  <rect x="42" y="34" width="1596" height="78" rx="24" fill="url(#headerBand)" opacity="0.78"/>

  <text class="title" x="72" y="86">COPD Stats Selector: Detailed Critical-Step Discovery</text>

  <text class="section" x="92" y="180">1. STEP INPUTS</text>
  <text class="section" x="408" y="180">2. GROUPING AND FILTERING</text>
  <text class="section" x="1222" y="180">3. TRAJECTORY-WISE SELECTION</text>

  <rect x="76" y="224" width="238" height="132" rx="26" fill="#E8F2FF" stroke="#3B82F6" stroke-width="2.4" filter="url(#shadow)"/>
  <text class="boxTitle" x="110" y="272">Rollout Step Pool</text>
  <text class="boxText" x="110" y="314">All steps from the</text>
  <text class="boxText" x="110" y="342">current rollout batch</text>

  <rect x="76" y="392" width="238" height="166" rx="26" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="boxTitle" x="110" y="440">Step Signals</text>
  <text class="boxText" x="110" y="482">Step returns</text>
  <text class="boxText" x="110" y="514">Anchor states</text>
  <text class="boxText" x="110" y="546">Trajectory identities</text>

  <rect x="356" y="198" width="806" height="432" rx="30" fill="#FFF9ED" stroke="#F59E0B" stroke-width="2.6" filter="url(#shadow)"/>
  <rect x="386" y="224" width="210" height="36" rx="18" fill="#FDE68A"/>
  <text class="pill" x="432" y="248">STATS SELECTOR</text>

  <rect x="390" y="276" width="222" height="122" rx="24" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text class="boxTitle" x="422" y="322">Prompt-Level</text>
  <text class="boxTitle" x="422" y="350">Partition</text>
  <text class="boxText" x="422" y="382">Separate steps by</text>
  <text class="boxText" x="422" y="410">their rollout group</text>

  <rect x="648" y="276" width="222" height="122" rx="24" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text class="boxTitle" x="680" y="322">Anchor-State</text>
  <text class="boxTitle" x="680" y="350">Clustering</text>
  <text class="boxText" x="680" y="382">Gather comparable</text>
  <text class="boxText" x="680" y="410">decision states</text>

  <rect x="906" y="276" width="222" height="122" rx="24" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text class="boxTitle" x="938" y="322">State-Step</text>
  <text class="boxTitle" x="938" y="350">Groups</text>
  <text class="boxText" x="938" y="382">Build groups of steps</text>
  <text class="boxText" x="938" y="410">from similar states</text>

  <rect x="390" y="438" width="222" height="134" rx="24" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text class="boxTitle" x="422" y="486">Group</text>
  <text class="boxTitle" x="422" y="514">Summary</text>
  <text class="boxText" x="422" y="546">Measure return spread</text>
  <text class="boxText" x="422" y="574">inside each group</text>

  <rect x="648" y="438" width="222" height="134" rx="24" fill="#ECFEFF" stroke="#0EA5E9" stroke-width="2"/>
  <text class="boxTitle" x="680" y="486">Eligible</text>
  <text class="boxTitle" x="680" y="514">Groups</text>
  <text class="boxText" x="680" y="546">Keep sufficiently large</text>
  <text class="boxText" x="680" y="574">and informative groups</text>

  <rect x="906" y="438" width="222" height="134" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text class="boxTitle" x="938" y="486">Weak-Step</text>
  <text class="boxTitle" x="938" y="514">Candidates</text>
  <text class="boxText" x="938" y="546">Mark steps that lag</text>
  <text class="boxText" x="938" y="574">behind their peers</text>

  <rect x="618" y="592" width="278" height="44" rx="22" fill="#FFF1CC" stroke="#F59E0B" stroke-width="1.8"/>
  <text class="boxText" x="657" y="621">Candidate critical steps</text>

  <rect x="1210" y="224" width="246" height="166" rx="26" fill="#F8FAFC" stroke="#475569" stroke-width="2.4" filter="url(#shadow)"/>
  <text class="boxTitle" x="1242" y="272">Per-Trajectory</text>
  <text class="boxTitle" x="1242" y="300">Ranking</text>
  <text class="boxText" x="1242" y="338">Rank candidates within</text>
  <text class="boxText" x="1242" y="366">each trajectory</text>

  <rect x="1210" y="420" width="246" height="166" rx="26" fill="#EEF6FF" stroke="#2563EB" stroke-width="2.4" filter="url(#shadow)"/>
  <text class="boxTitle" x="1242" y="468">Top-K</text>
  <text class="boxTitle" x="1242" y="496">Selection</text>
  <text class="boxText" x="1242" y="534">Keep only the most</text>
  <text class="boxText" x="1242" y="562">critical steps</text>

  <rect x="1492" y="304" width="120" height="202" rx="26" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.6" filter="url(#shadow)"/>
  <text class="boxTitle" x="1520" y="372">Critical</text>
  <text class="boxTitle" x="1524" y="402">Step</text>
  <text class="boxTitle" x="1522" y="432">Mask</text>

  <text class="section" x="92" y="700">4. KEY DESIGN CHOICES</text>

  <rect x="76" y="732" width="280" height="126" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text class="boxTitle" x="108" y="780">State Similarity</text>
  <text class="boxText" x="108" y="822">Exact matching or</text>
  <text class="boxText" x="108" y="850">approximate matching</text>

  <rect x="388" y="732" width="280" height="126" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text class="boxTitle" x="420" y="780">Minimum Support</text>
  <text class="boxText" x="420" y="822">Ignore tiny groups</text>
  <text class="boxText" x="420" y="850">before comparison</text>

  <rect x="700" y="732" width="280" height="126" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text class="boxTitle" x="732" y="780">Variance Focus</text>
  <text class="boxText" x="732" y="822">Prefer groups where</text>
  <text class="boxText" x="732" y="850">decisions matter most</text>

  <rect x="1012" y="732" width="280" height="126" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text class="boxTitle" x="1044" y="780">Weak-Step Bias</text>
  <text class="boxText" x="1044" y="822">Focus on steps that</text>
  <text class="boxText" x="1044" y="850">underperform their group</text>

  <rect x="1324" y="732" width="280" height="126" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text class="boxTitle" x="1356" y="780">Trajectory Top-K</text>
  <text class="boxText" x="1356" y="822">Cap the number of</text>
  <text class="boxText" x="1356" y="850">selected steps</text>

  <path d="M314 290H356" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M314 474H356" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M612 337H648" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M870 337H906" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M501 398V438" stroke="#64748B" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M759 398V438" stroke="#64748B" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1017 398V438" stroke="#64748B" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M612 505H648" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M870 505H906" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M1128 505H1180V614H1210" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M896 614H1170" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M1333 390V420" stroke="#64748B" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1456 503H1492" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <circle cx="648" cy="337" r="5.5" fill="#475569"/>
  <circle cx="906" cy="337" r="5.5" fill="#475569"/>
  <circle cx="648" cy="505" r="5.5" fill="#475569"/>
  <circle cx="906" cy="505" r="5.5" fill="#475569"/>
</svg>
